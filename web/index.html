<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget keeps the composer above the on-screen keyboard, which is the
     whole point of this app. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1219">
<meta name="mobile-web-app-capable" content="yes">
<title>Claude sessions</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<script>
  /* Applied before first paint so a forced theme doesn't flash the other one.
     "system" stores nothing and leaves the CSS media query in charge. */
  try {
    var saved = localStorage.getItem('cc-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) { /* private mode: fall back to system */ }
</script>
</head>
<body>

<!-- Sign in -->
<section id="screen-login" class="screen">
  <div class="login">
    <h1>Claude sessions</h1>
    <p class="login-sub" id="login-sub">Sign in to the hub.</p>
    <!-- A real form so Android offers a "go" key and password managers fill it. -->
    <form id="login-form" autocomplete="on">
      <input id="login-user" name="username" type="text" placeholder="Username"
             autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <input id="login-pass" name="password" type="password" placeholder="Password"
             autocomplete="current-password">
      <button id="login-submit" type="submit">Sign in</button>
    </form>
    <p id="login-error" class="login-error"></p>
  </div>
</section>

<!-- Session list -->
<section id="screen-list" class="screen is-active">
  <header class="topbar">
    <button id="btn-menu" class="iconbtn" aria-label="Servers">☰</button>
    <button class="topbar-titles" id="btn-account" type="button">
      <h1>Sessions</h1>
      <span id="server-label" class="meta sub">connecting…</span>
    </button>
    <button id="btn-theme" class="iconbtn" aria-label="Change theme">◐</button>
    <button id="btn-refresh" class="iconbtn" aria-label="Refresh sessions">⟳</button>
    <button id="btn-new" class="iconbtn" aria-label="New session">＋</button>
  </header>
  <!-- Only rendered when a server actually has more than one agent, so the common
       single-agent case gains no furniture. -->
  <div id="prov-bar" class="prov-bar" hidden></div>
  <div id="session-list" class="scroll"></div>
  <!-- Starred servers, for switching without opening the drawer. Empty until
       something is starred, and hidden entirely rather than sitting there blank. -->
  <div id="fav-bar" class="fav-bar" hidden></div>
</section>

<!-- Chat -->
<section id="screen-chat" class="screen">
  <!-- Shown instead of the chat on a wide screen, where the sidebar is always up and
       something has to occupy the other half before a session is picked. -->
  <div id="chat-empty" class="chat-empty">
    <div>
      <strong>Pick a session</strong>
      <span>Your projects are on the left. ＋ starts a new session in any folder.</span>
    </div>
  </div>

  <header class="topbar">
    <button id="btn-back" class="iconbtn" aria-label="Back to sessions">‹</button>
    <div class="topbar-titles">
      <h1 id="chat-title">…</h1>
      <span id="chat-meta" class="meta sub"></span>
    </div>
    <button id="btn-info" class="iconbtn" aria-label="Session info" title="Session info">ⓘ</button>
    <span id="chat-bead" class="bead"></span>
  </header>
  <div id="chat-notice"></div>
  <div class="thread-wrap">
    <div id="thread-scroll" class="scroll">
      <div id="thread" class="thread"></div>
    </div>
    <!-- Only while scrolled up. Reading back through a long session and then having to
         swipe all the way down again is the whole reason this exists. -->
    <button id="btn-bottom" class="to-bottom" hidden aria-label="Jump to the latest message">↓</button>
    <!-- Shown only while an image is actually over the window. -->
    <div id="drop-veil" class="drop-veil" hidden>
      <div class="drop-card">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
          <circle cx="8.75" cy="10" r="1.6"/>
          <path d="M3.5 17.5l4.8-4.8a2 2 0 0 1 2.8 0L14 16"/>
          <path d="M13.2 14.8l2.3-2.3a2 2 0 0 1 2.8 0l2.2 2.2"/>
        </svg>
        <strong>Drop to send</strong>
        <span>PNG, JPEG or WebP. Anything typed becomes the caption.</span>
      </div>
    </div>
  </div>
  <div class="composer">
    <!-- Command menu and hint sit above the keys, in normal flow: a floating panel
         would end up under the on-screen keyboard on half the phones that matter. -->
    <div id="cmd-pop" class="cmd-pop" hidden role="listbox" aria-label="Slash commands"></div>
    <div id="cmd-hint" class="cmd-hint" hidden></div>
    <div class="keybar">
      <!-- Relabelled per agent by applyKeyBar: esc for Claude, ^U for Codex. -->
      <button class="key" data-key="clear">esc</button>
      <button class="key" data-key="ctrl-c">^C</button>
      <button class="key" data-key="up">↑</button>
      <button class="key" data-key="down">↓</button>
      <button class="key" data-key="tab">⇥</button>
      <button class="key" data-key="shift-tab">⇧⇥</button>
      <button class="key" data-key="enter">⏎</button>
      <button class="key" id="btn-peek">screen</button>
      <button class="key" id="btn-pick">conversation</button>
    </div>
    <div class="compose-row">
      <!-- The field carries the border and background so the highlight layer can sit
           behind the text without a second box around it. -->
      <div id="compose-field" class="compose-field">
        <div id="compose-mirror" class="compose-mirror" aria-hidden="true"></div>
        <textarea id="compose" rows="1" placeholder="Message this session…"
                  autocapitalize="sentences" autocorrect="on" spellcheck="true"></textarea>
      </div>
      <!-- Screenshot. On Android this opens the system picker, which offers recent
           screenshots first, so it is two taps from taking one to sending it. -->
      <input id="pick-image" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button id="btn-image" class="iconbtn compose-icon" aria-label="Send a screenshot"
              title="Send a screenshot">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
          <circle cx="8.75" cy="10" r="1.6"/>
          <path d="M3.5 17.5l4.8-4.8a2 2 0 0 1 2.8 0L14 16"/>
          <path d="M13.2 14.8l2.3-2.3a2 2 0 0 1 2.8 0l2.2 2.2"/>
        </svg>
      </button>
      <button id="btn-send" class="send" aria-label="Send message" disabled>↑</button>
    </div>
  </div>
</section>

<!-- New session -->
<div id="sheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>New session</h2>
      <button id="btn-sheet-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <!-- Which agent to launch. Filled from what the hub reports it can see, so a
         machine without Codex never offers it. Hidden when there is only one. -->
    <div id="new-prov" class="new-prov" hidden></div>

    <label class="toggle">
      <input type="checkbox" id="skip-perms" checked>
      <span id="skip-perms-label">Skip permission prompts — the session acts without asking</span>
    </label>

    <!-- Quick list: repos found under CC_REPO_ROOTS. -->
    <div id="dir-list" class="scroll"></div>

    <!-- Browser: any folder, for when the quick list is empty or wrong. -->
    <div id="browse" hidden>
      <div id="crumbs" class="crumbs"></div>
      <div id="browse-list" class="scroll"></div>
      <div class="browse-foot">
        <button id="btn-mkdir" type="button" class="ghost">New folder</button>
        <button id="btn-start-here" type="button">Start here</button>
      </div>
    </div>
    <div class="sheet-foot">
      <button id="btn-browse" type="button" class="ghost">Browse all folders…</button>
    </div>
  </div>
</div>

<!-- Correct a bad pane-to-transcript match -->
<div id="pick-sheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Which conversation?</h2>
      <button id="btn-pick-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <div id="pick-list" class="scroll"></div>
  </div>
</div>

<!-- Session info -->
<div id="info-sheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2 id="info-title">Session</h2>
      <button id="btn-info-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <div id="info-body" class="scroll"></div>
  </div>
</div>

<!-- Server browser -->
<div id="drawer" class="drawer">
  <div class="drawer-panel">
    <div class="drawer-head">
      <h2>Servers</h2>
      <button id="btn-add-quick" class="iconbtn" type="button"
              aria-label="Add a server" title="Add a server">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="btn-drawer-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <div id="conn-list" class="scroll"></div>
    <div class="drawer-foot">
      <button id="btn-help" type="button" class="ghost">Help &amp; commands</button>
      <button id="btn-add-server" type="button" class="primary">Add a server</button>
    </div>
  </div>
</div>

<!-- Add a server. A centred modal, not a bottom sheet: it is a form you fill in and
     dismiss, not a list you browse, and it is reached from a drawer that is already
     anchored to one edge. -->
<div id="add-sheet" class="sheet is-modal">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Add a server</h2>
      <button id="btn-add-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <form id="add-form" class="add-form" autocomplete="on">
      <label class="field-label" for="add-label">Name</label>
      <input id="add-label" type="text" placeholder="e.g. sam — optional"
             autocapitalize="words">
      <label class="field-label" for="add-host">Address</label>
      <div class="add-row">
        <input id="add-host" type="text" placeholder="host or 100.x.y.z"
               autocapitalize="none" autocorrect="off" spellcheck="false">
        <input id="add-port" type="text" placeholder="7420" inputmode="numeric">
      </div>
      <label class="field-label" for="add-user">Sign in</label>
      <input id="add-user" type="text" placeholder="Username" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false">
      <input id="add-pass" type="password" placeholder="Password" autocomplete="current-password">
      <p id="add-error" class="login-error"></p>
      <div class="modal-foot">
        <button id="btn-add-cancel" type="button" class="ghost">Cancel</button>
        <button id="add-submit" type="submit" class="primary">Sign in and save</button>
      </div>
    </form>
  </div>
</div>

<!-- Rename a server -->
<div id="name-sheet" class="sheet is-modal">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Name this server</h2>
      <button id="btn-name-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <form id="name-form" class="add-form">
      <label class="field-label" for="name-input">Name</label>
      <input id="name-input" type="text" placeholder="e.g. sam" autocapitalize="words">
      <p id="name-where" class="field-note meta"></p>
      <div class="modal-foot">
        <button id="btn-name-cancel" type="button" class="ghost">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Account -->
<div id="account-sheet" class="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Account</h2>
      <button id="btn-account-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <div id="account-body"></div>
  </div>
</div>

<!-- Help -->
<div id="help-sheet" class="sheet">
  <div class="sheet-panel is-tall">
    <div class="sheet-head">
      <h2>Help</h2>
      <button id="btn-help-close" class="iconbtn" aria-label="Close">✕</button>
    </div>
    <div class="help-tabs">
      <button class="help-tab is-on" type="button" data-tab="tips">Tips</button>
      <button class="help-tab" type="button" data-tab="commands">Commands</button>
    </div>
    <input id="help-filter" class="help-filter" type="text" placeholder="Filter commands…"
           autocapitalize="none" autocorrect="off" spellcheck="false" hidden>
    <div id="help-body" class="scroll"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
